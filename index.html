<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernapp">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>Lernapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece5; --ink:#1c1c1e; --muted:#6b6863; --line:#e2ded5;
  --accent:#2f5d50; --ok:#2e7d4f; --ok-bg:#e3f1e8; --bad:#b3402f; --bad-bg:#f8e4df;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171a; --surface:#212226; --surface-2:#2a2b30; --ink:#f1efea; --muted:#a29f99; --line:#34353b;
    --accent:#7fb8a6; --ok:#6cc792; --ok-bg:#1f3a2a; --bad:#ef8a78; --bad-bg:#43251f; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%; touch-action:manipulation; min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}
header.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;
  min-height:52px;padding:6px 0;margin-bottom:6px}
header.bar h1{font-size:19px;font-weight:650;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--accent);flex:none}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
h2.sec{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.subject{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px;width:100%;text-align:left}
.subject:active{transform:scale(.99)}
.badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.subject .t{font-weight:650;font-size:18px}
.subject .s{color:var(--muted);font-size:14px}
.subject .chev{margin-left:auto;color:var(--muted)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.chip{position:relative;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.chip.on .pb{background:rgba(255,255,255,.75)}
.chip.wide{grid-column:span 2}
.rowtools{display:flex;gap:8px;margin:10px 0 0}
.pill{padding:8px 14px;border-radius:999px;background:var(--surface-2);font-size:15px;font-weight:550}
.pill:active{opacity:.7}
.topic{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.topic.on .check{background:var(--accent);border-color:var(--accent)}
.topic.on .check::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.topic .tt{flex:1;min-width:0}
.topic .tt b{font-weight:600;display:block}
.topic .tt small{color:var(--muted);font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:17px;font-weight:650}
.mode span{font-size:13px;color:var(--muted)}
.mode:disabled{opacity:.4}
.mode:active:not(:disabled){transform:scale(.98)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:12px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--accent)}.switch.on::after{left:23px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:14px;margin:8px 4px}
.progress{display:flex;align-items:center;gap:10px;margin:2px 0 14px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.progress .meter{flex:1;margin:0}
/* Karteikarte */
.flash{min-height:260px;padding:26px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;width:100%}
.flash .front{font-size:24px;font-weight:600;line-height:1.3}
.flash .back{font-size:20px;line-height:1.35}
.flash .info{font-size:14px;color:var(--muted)}
.flash .hintx{font-size:14px;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:8px 10px;line-height:1.4}
.flash .tap{font-size:13px;color:var(--muted);margin-top:8px}
.flash hr{width:40%;border:0;border-top:1px solid var(--line);margin:8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{padding:15px;border-radius:12px;font-weight:650;font-size:17px;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%;margin-top:14px}
.btn:active{opacity:.8}
/* Quiz */
.q{padding:20px 18px}
.q .kind{font-size:13px;color:var(--muted);margin-bottom:6px}
.q .prompt{font-size:20px;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{padding:14px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:17px}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback b{display:block;margin-bottom:2px}
.feedback .sol{color:var(--ink);margin-top:4px}
.feedback .sol small{display:block;color:var(--muted);margin-top:4px}
input.answer{width:100%;font-size:19px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:14px;outline:none}
input.answer:focus{border-color:var(--accent)}
/* Lesen */
.read{padding:18px 18px 8px;margin-bottom:14px}
.read h3{margin:0 0 10px;font-size:20px}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin:3px 0}
.md table{border-collapse:collapse;width:100%;font-size:15px;margin:4px 0 14px;display:block;overflow-x:auto}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.md th{font-weight:650;background:var(--surface-2)}
.md em{font-style:italic}
.vtab td:first-child{font-weight:600}
.vtab td.ty{color:var(--muted);font-size:13px;white-space:nowrap}
details.aufg{padding:14px 16px;margin-bottom:10px}
details.aufg summary{font-weight:600;list-style:none;cursor:pointer}
details.aufg summary::-webkit-details-marker{display:none}
/* Ergebnis */
.result{text-align:center;padding:28px 18px}
.result .big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted)}
.mist{padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.mist:last-child{border-bottom:0}
.mist b{display:block}
.hero{border-radius:var(--radius);overflow:hidden;line-height:0;box-shadow:var(--shadow)}
.hero img{width:100%;height:auto;display:block}
#splash{position:fixed;inset:0;z-index:50;background:#10202a url(startbild.jpg) 64% center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 24px calc(48px + env(safe-area-inset-bottom));transition:opacity .6s ease}
#splash::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
#splash h2{position:relative;color:#fff;font-size:34px;margin:0 0 18px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#splash button{position:relative;background:#fff;color:#1c1c1e;font-weight:700;font-size:19px;padding:16px 40px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#splash.out{opacity:0;pointer-events:none}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:26px}
.bits{display:flex;gap:10px;justify-content:center;margin-top:16px}
.bits .btn{min-width:90px;font-size:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="splash"><h2>Lernapp</h2><button id="b-go">Los geht’s</button></div>

<script src="latein.js"></script>
<script src="franzoesisch.js"></script>
<script src="geschichte.js"></script>
<script src="informatik.js"></script>
<script>
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  chev: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* Mini-Markdown: Absätze, **fett**, *kursiv*, Listen, Tabellen */
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
}
function md(src) {
  const lines = String(src).split("\n"); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
      out += "<table><thead><tr>" + cells(body[0]).map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        body.slice(1).map(r => "<tr>" + cells(r).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
      continue;
    }
    if (/^\s*[-•]\s+/.test(l)) {
      out += "<ul>"; while (i < lines.length && /^\s*[-•]\s+/.test(lines[i])) out += "<li>" + inline(lines[i++].replace(/^\s*[-•]\s+/, "")) + "</li>"; out += "</ul>"; continue;
    }
    if (/^\s*\d+\.\s+/.test(l)) {
      out += "<ol>"; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) out += "<li>" + inline(lines[i++].replace(/^\s*\d+\.\s+/, "")) + "</li>"; out += "</ol>"; continue;
    }
    const para = []; while (i < lines.length && lines[i].trim() && !/^\s*(\||[-•]\s|\d+\.\s)/.test(lines[i])) para.push(lines[i++]);
    out += "<p>" + para.map(inline).join("<br>") + "</p>";
  }
  return out;
}

/* ---------- Speicher (nur auf diesem Gerät) ---------- */
const STORE = "lernapp.v1";
let DB = { items: {}, sel: {}, opt: {} };
try { const raw = localStorage.getItem(STORE); if (raw) DB = Object.assign(DB, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch (e) {} }
const box = k => (DB.items[k] ? DB.items[k].b : 0);
const seen = k => !!DB.items[k];
function mark(k, ok) {
  const it = DB.items[k] || { b: 0, n: 0, f: 0 };
  it.n++; if (ok) { it.b = Math.min(5, it.b + 1); jingle(); } else { it.b = 0; it.f++; sadTone(); }
  it.t = Date.now(); DB.items[k] = it; save();
}
/* Erfolgston (wird im Browser erzeugt, keine Audiodatei nötig) */
let AC = null;
/* iPhone: Ohne diese Einstellung schaltet der Lautlos-Schalter alle Töne der Web-App stumm.
   «playback» lässt die App wie eine Musik-App klingen (iOS 17+). Für ältere Geräte zusätzlich
   eine stumme Audiodatei bei der ersten Berührung abspielen, das hat dieselbe Wirkung. */
function audioSessionPlayback() {
  try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch (e) {}
}
audioSessionPlayback();
let SILENT = null;
function unlockMedia() {
  try {
    if (!SILENT) { SILENT = new Audio("data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=="); SILENT.setAttribute("playsinline", ""); }
    const p = SILENT.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
/* Gemeinsamer Tonstart. iOS hält den Audio-Kontext nach Hintergrund oder Sperre oft an
   («suspended» oder «interrupted»). Darum: Kontext bei Bedarf neu erzeugen, aufwecken
   und die Töne erst spielen, wenn er wirklich läuft. */
function withAudio(play) {
  if (!opt("sound", true)) return;
  audioSessionPlayback();
  try {
    if (!AC || AC.state === "closed") AC = new (window.AudioContext || window.webkitAudioContext)();
    const go = () => { try { play(AC, AC.currentTime + 0.03); } catch (e) {} };
    if (AC.state === "running") return go();
    const p = AC.resume();
    if (p && p.then) p.then(go, go); else go();
  } catch (e) {}
}
/* Nach Hintergrund/Sperre den alten Kontext verwerfen; der nächste Tipp erzeugt einen frischen. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && AC) { try { AC.close(); } catch (e) {} AC = null; }
});
/* Jede Berührung weckt einen angehaltenen Kontext auf. */
["pointerdown", "touchend", "keydown"].forEach(ev => document.addEventListener(ev, () => {
  audioSessionPlayback();
  if (AC && AC.state !== "running") { try { AC.resume(); } catch (e) {} }
}, { capture: true, passive: true }));
function jingle() {
  withAudio((AC, t) => {
    [[784, 0, 0.16], [988, 0.08, 0.16], [1319, 0.16, 0.5]].forEach(([f, d, len], i) => {
      [["triangle", 1, 0.16], ["sine", 2, 0.04]].forEach(([type, mul, vol]) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = type; o.frequency.value = f * mul;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(vol, t + d + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + len);
        o.connect(g); g.connect(AC.destination);
        o.start(t + d); o.stop(t + d + len + 0.05);
      });
    });
  });
}
/* Ton bei falscher Antwort: zwei sanfte, absteigende Töne */
function sadTone() {
  withAudio((AC, t) => {
    [[392, 0, 0.22], [330, 0.2, 0.45]].forEach(([f, d, len]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(f, t + d);
      o.frequency.exponentialRampToValueAtTime(f * 0.94, t + d + len);
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.2, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + len);
      o.connect(g); g.connect(AC.destination);
      o.start(t + d); o.stop(t + d + len + 0.05);
    });
  });
}
/* Epische Start-Fanfare: kurzer Auftakt, dann grosser Dur-Akkord mit Pauke */
function fanfare(ctx, t0) {
  const out = ctx.createGain(); out.gain.value = 0.55; out.connect(ctx.destination);
  const brass = (f, start, len, vol) => {
    [-6, 0, 6].forEach(det => {
      const o = ctx.createOscillator(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
      flt.type = "lowpass"; flt.Q.value = 0.8;
      flt.frequency.setValueAtTime(500, start);
      flt.frequency.exponentialRampToValueAtTime(2600, start + 0.08);
      flt.frequency.exponentialRampToValueAtTime(1400, start + len);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(vol / 3, start + 0.04);
      g.gain.setValueAtTime(vol / 3, start + Math.max(0.05, len - 0.25));
      g.gain.exponentialRampToValueAtTime(0.0001, start + len);
      o.connect(flt); flt.connect(g); g.connect(out);
      o.start(start); o.stop(start + len + 0.05);
    });
  };
  const timpani = (start, f, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain();

function bedeutungFrage(v, pool, f) {
  const ds = distractors(v, pool, 3, x => !overlap(x.de, v.de) && norm(x.lemma) !== norm(v.lemma) && x.de !== v.de, (a, b) => overlap(a.de, b.de), f);
  const opts = shuffle([v.de, ...ds.map(x => x.de)]);
  return { key: v.key, kind: "Was bedeutet …?", prompt: v.la, o: opts, r: opts.indexOf(v.de), e: `${v.la} = ${v.de}` };
}
function wortFrage(v, pool, f) {
  const ds = distractors(v, pool, 3, x => !overlap(x.de, v.de) && norm(x.lemma) !== norm(v.lemma), (a, b) => norm(a.lemma) === norm(b.lemma), f);
  const opts = shuffle([v.lemma, ...ds.map(x => x.lemma)]);
  return { key: v.key, kind: `Wie heisst auf ${f.name} …?`, prompt: v.de, o: opts, r: opts.indexOf(v.lemma), e: `${v.de} = ${v.la}` };
}
function latinQuestion(v, pool, f) {
  const kinds = ["lade", "lade", "dela", "dela"];
  if (v.genus && GENUS[v.genus] && v.genus !== "m./f.") kinds.push("genus");
  if (v.perf) kinds.push("perf");
  const k = pick(kinds);
  if (k === "lade") return bedeutungFrage(v, pool, f);
  if (k === "dela") return wortFrage(v, pool, f);
  if (k === "genus") {
    const opts = ["maskulin", "feminin", "neutrum"];
    return { key: v.key, kind: "Welches Genus hat …?", prompt: `${v.lemma} (${v.de})`, o: opts, r: opts.indexOf(GENUS[v.genus]), e: `${v.la} – ${GENUS[v.genus]}` };
  }
  const ds = distractors(v, pool, 3, x => x.perf && norm(x.perf) !== norm(v.perf), (a, b) => norm(a.perf) === norm(b.perf), f);
  const opts = shuffle([v.perf, ...ds.map(x => x.perf)]);
  return { key: v.key, kind: "Perfekt (ich-Form) von …?", prompt: `${v.lemma} (${v.de.split(",")[0]})`, o: opts, r: opts.indexOf(v.perf), e: v.la };
}
function frenchQuestion(v, pool, f) {
  const kinds = ["lade", "lade", "dela", "dela"];
  if (v.genusFr === "m" || v.genusFr === "f") kinds.push("genus");
  const k = pick(kinds);
  if (k === "lade") return bedeutungFrage(v, pool, f);
  if (k === "dela") return wortFrage(v, pool, f);
  const opts = ["maskulin (un / le)", "feminin (une / la)"];
  return { key: v.key, kind: "Männlich oder weiblich?", prompt: `${v.bare} (${v.de})`, o: opts, r: v.genusFr === "m" ? 0 : 1, e: v.la };
}
VIEWS.quiz = ({ id }) => {
  const f = fachById(id); let qs = [];
  if (f.art === "vokabeln") {
    const pool = selectedLessons(f).flatMap(l => l.items);
    const items = prioritize(weakFilter(pool, v => v.key), v => v.key).slice(0, 10);
    const ask = f.parse === "fr" ? frenchQuestion : latinQuestion;
    qs = items.map(v => ask(v, pool, f));
    if (selection(f).includes("e")) {
      const intro = shuffle(f.einfuehrung.quiz).slice(0, pool.length ? 3 : 6).map(q => ({ key: f.id + ":q:" + q.f, kind: "Einführung", prompt: q.f, o: q.o, r: q.r, e: q.e, shuffle: true }));
      qs = shuffle([...qs, ...intro]);
    }
  } else {
    let items = selectedTopics(f).flatMap(t => t.quiz.map((q, i) => ({ key: t.quizKeys[i], kind: t.titel, prompt: q.f, o: q.o, r: q.r, e: q.e, shuffle: true })));
    items = weakFilter(items, q => q.key);
    qs = prioritize(items, q => q.key).slice(0, 10);
  }
  qs = qs.map(q => { if (!q.shuffle) return q; const idx = shuffle(q.o.map((_, i) => i)); return { ...q, o: idx.map(i => q.o[i]), r: idx.indexOf(q.r) }; });

};
function runQuiz(qs) {
  let i = 0, score = 0; const wrong = [];
  function draw(chosen) {
    if (!qs.length) return shell("Quiz", emptyMsg());
    if (i >= qs.length) return finish();
    const q = qs[i], done = chosen !== undefined;
    shell("Quiz", `<div class="progress"><span>${i + 1} / ${qs.length}</span><span class="meter"><i style="width:${100 * i / qs.length}%"></i></span><span>${score} ✓</span></div>
      <div class="card q"><div class="kind">${esc(q.kind)}</div><div class="prompt">${esc(q.prompt)}</div></div>
      <div class="opts">${q.o.map((o, k) => `<button class="opt ${done && k === q.r ? "right" : ""} ${done && k === chosen && k !== q.r ? "wrong" : ""}" data-k="${k}" ${done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
      ${done ? `<div class="feedback ${chosen === q.r ? "ok" : "bad"}"><b>${chosen === q.r ? "Richtig!" : "Leider falsch."}</b>${q.e ? `<span class="sol">${esc(q.e)}</span>` : ""}</div>
      <button class="btn primary full" id="b-next">${i + 1 < qs.length ? "Weiter" : "Auswertung"}</button>` : ""}`);
    if (!done) document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.r; if (ok) score++; else wrong.push(q); mark(q.key, ok); draw(k);
    });
    else $("#b-next").onclick = () => { i++; draw(); };
  }
  function finish() {
    shell("Quiz", `<div class="card result"><div class="big">${score} / ${qs.length}</div><div class="sub">richtig</div></div>
      ${wrong.length ? `<h2 class="sec">Das solltest du nochmal anschauen</h2><div class="card">${wrong.map(q => `<div class="mist"><b>${esc(q.prompt)}</b>${esc(q.o[q.r])}</div>`).join("")}</div>
      <button class="btn primary full" id="b-again">Die falschen nochmal</button>` : ""}
      <button class="btn ghost full" id="b-new">Neues Quiz</button>`);
    if (wrong.length) $("#b-again").onclick = () => runQuiz(shuffle(wrong));
    $("#b-new").onclick = () => render();
  }
  draw();
}

/* --- Schreiben (Vokabelfächer) --- */
VIEWS.schreiben = ({ id }) => {
  const f = fachById(id);
  const items = prioritize(weakFilter(selectedLessons(f).flatMap(l => l.items).filter(v => v.write), v => v.key), v => v.key).slice(0, 10);
  let i = 0, score = 0; const wrong = [];
  function draw(answer) {
    if (!items.length) return shell("Schreiben", emptyMsg());
    if (i >= items.length) return finish();
    const v = items[i], done = answer !== undefined;
    let fb = "";
    if (done) {
      const exact = v.write.some(w => loose(w) === loose(answer));
      const ok = answer.trim() !== "" && (exact || v.write.some(w => norm(w) === norm(answer)));
      fb = `<div class="feedback ${ok ? "ok" : "bad"}"><b>${ok ? (exact ? "Richtig!" : (f.akzentText || "Richtig – mit Längezeichen:")) : (answer.trim() ? "Leider falsch." : "Lösung:")}</b><span class="sol">${esc(v.la)}${v.hint ? `<small>${esc(v.hint)}</small>` : ""}</span></div>
        <button class="btn primary full" id="b-next">${i + 1 < items.length ? "Weiter" : "Auswertung"}</button>`;
    }
    shell("Schreiben", `<div class="progress"><span>${i + 1} / ${items.length}</span><span class="meter"><i style="width:${100 * i / items.length}%"></i></span><span>${score} ✓</span></div>
      <div class="card q"><div class="kind">Wie heisst auf ${esc(f.name)} …?${v.info ? " · " + esc(v.info.split(" · ")[0]) : ""}</div><div class="prompt">${esc(v.de)}</div></div>
      <input class="answer" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(f.platzhalter || "Grundform eintippen")}" ${done ? `value="${esc(answer)}" disabled` : ""}>
      ${done ? fb : `<div class="actions"><button class="btn ghost" id="b-skip">Weiss nicht</button><button class="btn primary" id="b-check">Prüfen</button></div>
      <p class="hint">${esc(f.schreibHinweis || "Längezeichen (ā, ē …) musst du nicht tippen.")}</p>`}`);
    if (!done) {
      const inp = $("#inp"); setTimeout(() => inp.focus(), 50);
      const check = (val) => {
        const ok = v.write.some(w => norm(w) === norm(val)) && val.trim() !== "";
        if (ok) score++; else wrong.push(v); mark(v.key, ok); draw(val);
      };
      $("#b-check").onclick = () => check(inp.value);
      $("#b-skip").onclick = () => check("");
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(inp.value); });
    } else $("#b-next").onclick = () => { i++; draw(); };
  }
  function finish() {
    shell("Schreiben", `<div class="card result"><div class="big">${score} / ${items.length}</div><div class="sub">richtig</div></div>
      ${wrong.length ? `<h2 class="sec">Nochmal anschauen</h2><div class="card">${wrong.map(v => `<div class="mist"><b>${esc(v.de)}</b>${esc(v.la)}</div>`).join("")}</div>` : ""}
      <button class="btn primary full" id="b-new">Neue Runde</button>`);
    $("#b-new").onclick = () => render();
  }
  draw();
};

/* --- Rechentrainer (Informatik) --- */
const bin = n => n.toString(2);
const parts = n => { const p = []; for (let v = 256; v >= 1; v /= 2) if (n & v) p.push(v); return p.join(" + "); };
const WOERTER = ["HALLO", "ROM", "NIL", "CODE", "BIT", "BYTE", "GATE", "SONNE", "BUCH", "TIGER", "ZEBRA", "KATZE", "BERG", "FLUSS", "REGEN"];
const caesar = (w, s) => w.replace(/[A-Z]/g, c => String.fromCharCode((c.charCodeAt(0) - 65 + s + 26) % 26 + 65));
const bits = n => Array.from({ length: n }, () => rnd(0, 1)).join("");
const xor = (a, b) => a.split("").map((c, i) => (c === b[i] ? "0" : "1")).join("");
const GATES = { AND: (a, b) => a & b, OR: (a, b) => a | b, NAND: (a, b) => 1 - (a & b), XOR: (a, b) => a ^ b };
const TRAINER = {
  binaer: [
    () => { const n = rnd(5, 255); return { kind: "Dezimal → binär", prompt: `${n}`, answer: bin(n), type: "bin", e: `${n} = ${parts(n)} → ${bin(n)}` }; },
    () => { const n = rnd(5, 255); return { kind: "Binär → dezimal", prompt: bin(n), answer: String(n), type: "num", e: `${bin(n)} = ${parts(n)} = ${n}` }; },
    () => { const a = rnd(5, 60), b = rnd(3, 40); return { kind: "Binär addieren", prompt: `${bin(a)} + ${bin(b)}`, answer: bin(a + b), type: "bin", e: `${a} + ${b} = ${a + b} → ${bin(a + b)}` }; },
    () => { const a = rnd(12, 63), b = rnd(3, a - 2); return { kind: "Binär subtrahieren", prompt: `${bin(a)} − ${bin(b)}`, answer: bin(a - b), type: "bin", e: `${a} − ${b} = ${a - b} → ${bin(a - b)}` }; },
    () => { const c = String.fromCharCode(rnd(65, 90)); const code = bin(c.charCodeAt(0)).padStart(8, "0"); return { kind: "ASCII: Buchstabe → Code", prompt: c, answer: code, type: "bin8", e: `${c} = ${c.charCodeAt(0)} = ${code}` }; },
    () => { const c = String.fromCharCode(rnd(65, 90)); const code = bin(c.charCodeAt(0)).padStart(8, "0"); return { kind: "ASCII: Code → Buchstabe", prompt: code, answer: c, type: "txt", e: `${code} = ${c.charCodeAt(0)} = ${c}` }; }
  ],
  gates: [
    () => { const g = pick(Object.keys(GATES)), a = rnd(0, 1), b = rnd(0, 1), q = GATES[g](a, b); return { kind: "Was gibt das Gate aus?", prompt: `${g} mit A = ${a}, B = ${b}`, answer: String(q), type: "bit", e: `${g}(${a}, ${b}) = ${q}` }; },
    () => { const a = rnd(0, 1); return { kind: "Was gibt das Gate aus?", prompt: `NOT mit A = ${a}`, answer: String(1 - a), type: "bit", e: `NOT dreht um: ${a} → ${1 - a}` }; },
    () => { const n = rnd(1, 5); return { kind: "Wahrheitstabelle", prompt: `Wie viele Zeilen hat die Wahrheitstabelle bei ${n} Eingang${n > 1 ? "en" : ""}?`, answer: String(2 ** n), type: "num", e: `2^${n} = ${2 ** n}` }; }
  ],
  krypto: [
    () => { const w = pick(WOERTER), s = pick([3, 3, 1, 2, 4, 5]); return { kind: `Cäsar: verschlüsseln (Verschiebung ${s})`, prompt: w, answer: caesar(w, s), type: "txt", e: w.split("").map(c => c + "→" + caesar(c, s)).join(", ") }; },
    () => { const w = pick(WOERTER), s = pick([3, 3, 1, 2, 4, 5]); return { kind: `Cäsar: entschlüsseln (Verschiebung ${s})`, prompt: caesar(w, s), answer: w, type: "txt", e: `Jeden Buchstaben ${s} Plätze zurück: ${w}` }; },
    () => { const n = rnd(4, 6), p = bits(n), k = bits(n); return { kind: "XOR: Geheimtext berechnen", prompt: `Klartext ${p}\nSchlüssel ${k}`, answer: xor(p, k), type: "txt", e: "Gleich → 0, verschieden → 1: " + xor(p, k) }; },
    () => { const n = rnd(4, 6), c = bits(n), k = bits(n); return { kind: "XOR: Klartext berechnen", prompt: `Geheimtext ${c}\nSchlüssel ${k}`, answer: xor(c, k), type: "txt", e: "Nochmals XOR mit dem Schlüssel: " + xor(c, k) }; }
  ]

function checkTrainer(t, val) {
  const v = val.replace(/\s+/g, "").toUpperCase();
  if (t.type === "bin") return v.replace(/^0+(?=.)/, "") === t.answer;
  if (t.type === "bin8") return v.padStart(8, "0") === t.answer;
  return v === t.answer.toUpperCase();
}
VIEWS.trainer = ({ id }) => {
  const f = fachById(id);
  const gens = selectedTopics(f).filter(t => t.trainer).flatMap(t => TRAINER[t.trainer]);
  const tasks = gens.length ? Array.from({ length: 10 }, () => pick(gens)()) : [];
  let i = 0, score = 0;
  function draw(answer) {
    if (!tasks.length) return shell("Rechentrainer", `<div class="empty">Wähle ein Thema mit Rechentrainer (Binärzahlen, Gates oder Verschlüsselung).</div>`);
    if (i >= tasks.length) {
      shell("Rechentrainer", `<div class="card result"><div class="big">${score} / ${tasks.length}</div><div class="sub">richtig</div></div><button class="btn primary full" id="b-new">Neue Runde</button>`);
      return ($("#b-new").onclick = () => render());
    }
    const t = tasks[i], done = answer !== undefined, ok = done && checkTrainer(t, answer);
    const input = t.type === "bit"
      ? (done ? "" : `<div class="bits"><button class="btn ghost" data-b="0">0</button><button class="btn ghost" data-b="1">1</button></div>`)
      : `<input class="answer" id="inp" ${t.type === "txt" ? 'autocapitalize="characters"' : 'inputmode="numeric" pattern="[0-9]*"'} autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Antwort" ${done ? `value="${esc(answer)}" disabled` : ""}>`;
    shell("Rechentrainer", `<div class="progress"><span>${i + 1} / ${tasks.length}</span><span class="meter"><i style="width:${100 * i / tasks.length}%"></i></span><span>${score} ✓</span></div>
      <div class="card q"><div class="kind">${esc(t.kind)}</div><div class="prompt" style="font-variant-numeric:tabular-nums;white-space:pre-line">${esc(t.prompt)}</div></div>
      ${input}
      ${done ? `<div class="feedback ${ok ? "ok" : "bad"}"><b>${ok ? "Richtig!" : "Leider falsch. Richtig ist: " + esc(t.answer)}</b><span class="sol">${esc(t.e)}</span></div>
        <button class="btn primary full" id="b-next">${i + 1 < tasks.length ? "Weiter" : "Auswertung"}</button>`
        : (t.type === "bit" ? "" : `<button class="btn primary full" id="b-check">Prüfen</button>`)}`);
    const submit = val => { if (checkTrainer(t, val)) { score++; jingle(); } else sadTone(); draw(val); };
    if (!done) {
      if (t.type === "bit") document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => submit(b.dataset.b));
      else { const inp = $("#inp"); setTimeout(() => inp.focus(), 50); $("#b-check").onclick = () => submit(inp.value); inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(inp.value); }); }
    } else $("#b-next").onclick = () => { i++; draw(); };
  }
  draw();
};
